test:
  stage: test
  image: node:16.8.0-bullseye
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test
  needs: []
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH'

lint:
  stage: test
  image: node:16.8.0-bullseye
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint:check
  needs: []
  rules:
    - if: '$TEST_DISABLED'
      when: never
    - if: '$CI_COMMIT_TAG || $CI_COMMIT_BRANCH'
